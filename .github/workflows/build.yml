name: Build APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q VideoGrab.zip
      - run: printf "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx3g\n" > VideoGrab/gradle.properties
      - run: sed -i 's/listOf("arm64-v8a", "armeabi-v7a")/listOf("arm64-v8a")/' VideoGrab/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug
        working-directory: VideoGrab
      - run: gh release create v${{ github.run_number }} VideoGrab/app/build/outputs/apk/debug/app-debug.apk --title "VideoGrab" --notes "APK"
        env:
          GH_TOKEN: ${{ github.token }}
