name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q VideoGrab.zip
      - run: printf "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx3g\n" > VideoGrab/gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug
        working-directory: VideoGrab
      - uses: actions/upload-artifact@v4
        with:
          name: VideoGrab-apk
          path: VideoGrab/app/build/outputs/apk/debug/*.apk
